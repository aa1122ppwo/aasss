<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مديرية الأمن العام - نظام التدقيق والبحث</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #0b2545;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            background-color: #0b2545;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .logo {
            width: 60px; 
            height: auto;
            margin-bottom: 5px;
        }
        header h1 {
            margin: 0;
            font-size: 18px;
        }
        header p {
            margin: 3px 0 0;
            color: #94a3b8;
            font-size: 12px;
        }
        .main-wrapper {
            background-color: #f4f6f9;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px 15px;
            flex: 1;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .container {
            width: 100%;
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }
        h2 {
            color: #0b2545;
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 12px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: #f8fafc;
        }
        input:focus {
            border-color: #134074;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #134074;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .result-box {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
            line-height: 1.6;
            text-align: right;
        }
        .hidden {
            display: none !important;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #0b2545;
            color: #94a3b8;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Public_Security_Directorate_Jordan.svg/1200px-Public_Security_Directorate_Jordan.svg.png" alt="شعار الأمن العام" class="logo">
        <h1>مديرية الأمن العام</h1>
        <p>نظام التدقيق والبحث الشامل</p>
    </header>

    <div class="main-wrapper">
        <!-- شاشة تسجيل الدخول -->
        <div class="container" id="loginContainer">
            <h2>تسجيل الدخول للنظام</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="accessPassword">كلمة المرور:</label>
                    <input type="password" id="accessPassword" required placeholder="أدخل كلمة المرور">
                </div>
                <button type="submit">دخول</button>
                <div id="loginError" class="result-box" style="background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; text-align: center;">كلمة المرور غير صحيحة!</div>
            </form>
        </div>

        <!-- الشاشات الرئيسية (مخفية حتى يتم الدخول) -->
        <div id="appContainer" class="hidden" style="display: flex; flex-direction: column; gap: 15px;">
            
            <!-- قسم تدقيق القيود -->
            <div class="container">
                <h2>تدقيق القيود (الرقم الوطني)</h2>
                <form id="checkForm">
                    <div class="form-group">
                        <label for="fullName">الاسم الكامل:</label>
                        <input type="text" id="fullName" required placeholder="الاسم ثلاثياً">
                    </div>
                    <div class="form-group">
                        <label for="motherName">اسم الأم:</label>
                        <input type="text" id="motherName" required placeholder="اسم الأم">
                    </div>
                    <div class="form-group">
                        <label for="nationalId">الرقم الوطني:</label>
                        <input type="tel" id="nationalId" required placeholder="10 أرقام" maxlength="10">
                    </div>
                    <button type="submit">تدقيق القيود</button>
                </form>
                <div id="result" class="result-box" style="text-align: center;"></div>
            </div>

            <!-- قسم فحص أي IP في العالم والأردن -->
            <div class="container">
                <h2>فحص وتتبع عنوان IP ديناميكي</h2>
                <form id="ipForm">
                    <div class="form-group">
                        <label for="ipInput">أدخل أي عنوان IP:</label>
                        <input type="text" id="ipInput" required placeholder="مثال: 91.186.227.236">
                    </div>
                    <button type="submit">استعلام عن الـ IP</button>
                </form>
                <div id="ipResult" class="result-box"></div>
            </div>

        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 مديرية الأمن العام
    </footer>

    <script>
        // التحقق من كلمة المرور
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const passInput = document.getElementById('accessPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (passInput === '@oday1996oday@') {
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
            } else {
                errorDiv.style.display = 'block';
            }
        });

        // قاعدة بيانات القيود
        const database = [
            { id: "9981234567", name: "أحمد محمد العمري", motherName: "فاطمة أحمد", status: "سليم - لا توجد قيود أمنية", type: "success" },
            { id: "2009876543", name: "محمد عبد الله الخوالدة", motherName: "مريم سالم", status: "مطلوب التنفيذ القضائي", type: "danger" }
        ];

        document.getElementById('checkForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nationalIdInput = document.getElementById('nationalId').value.trim();
            const resultDiv = document.getElementById('result');

            if (nationalIdInput.length !== 10 || isNaN(nationalIdInput)) {
                resultDiv.style.display = 'block';
                resultDiv.style.backgroundColor = '#ffebee';
                resultDiv.style.color = '#c62828';
                resultDiv.innerHTML = 'خطأ: يجب أن يتكون الرقم الوطني من 10 أرقام.';
                return;
            }

            const person = database.find(item => item.id === nationalIdInput);
            resultDiv.style.display = 'block';

            if (person) {
                resultDiv.style.backgroundColor = person.type === 'danger' ? '#ffebee' : '#e8f5e9';
                resultDiv.style.color = person.type === 'danger' ? '#c62828' : '#2e7d32';
                resultDiv.innerHTML = `الاسم: ${person.name}<br>الحالة: <strong>${person.status}</strong>`;
            } else {
                resultDiv.style.backgroundColor = '#e8f5e9';
                resultDiv.style.color = '#2e7d32';
                resultDiv.innerHTML = `الاسم: ${document.getElementById('fullName').value}<br>الحالة: <strong>سليم - لا توجد قيود</strong>`;
            }
        });

        // جلب بيانات أي IP بشكل ديناميكي دون مشاكل CORS
        document.getElementById('ipForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const ipVal = document.getElementById('ipInput').value.trim();
            const ipResultDiv = document.getElementById('ipResult');

            ipResultDiv.style.display = 'block';
            ipResultDiv.style.backgroundColor = '#f1f5f9';
            ipResultDiv.style.color = '#334155';
            ipResultDiv.innerHTML = 'جاري جلب بيانات الـ IP...';

            try {
                const response = await fetch(`https://ipwho.is/${ipVal}`);
                const data = await response.json();

                if (!data.success) {
                    ipResultDiv.style.backgroundColor = '#ffebee';
                    ipResultDiv.style.color = '#c62828';
                    ipResultDiv.innerHTML = 'عذراً، عنوان الـ IP غير صحيح أو غير موجود.';
                    return;
                }

                ipResultDiv.style.backgroundColor = '#e8f5e9';
                ipResultDiv.style.color = '#2e7d32';
                ipResultDiv.innerHTML = `
                    <strong>نتيجة فحص الـ IP (${data.ip}):</strong><br>
                    - الدولة: ${data.country} (${data.country_code})<br>
                    - المنطقة: ${data.region}<br>
                    - المدينة: ${data.city}<br>
                    - المزود (ISP): ${data.connection.isp}<br>
                    - الشركة أو الشبكة: ${data.connection.org}<br>
                    - خطوط الطول والعرض: ${data.latitude}, ${data.longitude}
                `;
            } catch (error) {
                ipResultDiv.style.backgroundColor = '#ffebee';
                ipResultDiv.style.color = '#c62828';
                ipResultDiv.innerHTML = 'حدث خطأ في الاتصال بالشبكة.';
            }
        });
    </script>

</body>
</html>
