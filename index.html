<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة تحكم بوت واتساب - Gemini AI</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { 
            background-color: #0b2545; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        header {
            background: #134074;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        h2 { color: #ee6c4d; margin: 0 0 4px 0; font-size: 16px; }
        .status { color: #2b9348; font-weight: bold; font-size: 12px; }
        
        .api-box {
            background: #134074;
            padding: 8px 12px;
            display: flex;
            gap: 10px;
            max-width: 100%;
            border-bottom: 1px solid #1e3a8a;
        }
        .api-box input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #475569;
            border-radius: 4px;
            background: #0f172a;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .chat-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #0b2545;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #3b82f6;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .ai-message {
            background-color: #134074;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid #334155;
        }
        
        .input-area {
            background: #134074;
            padding: 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #1e3a8a;
        }
        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .input-area button {
            background-color: #ee6c4d;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2>نظام الرد الآلي للرقم: 0788251064</h2>
        <div class="status">السيرفر متصل ويعمل ✅</div>
    </header>

    <!-- خانة إدخال مفتاح جيمني للتجربة المباشرة -->
    <div class="api-box">
        <input type="password" id="apiKey" placeholder="ضع مفتاح Gemini API Key هنا للتجربة الفورية...">
    </div>

    <!-- صندوق عرض المحادثات -->
    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">أهلاً بك! أضف مفتاح جيمني في الأعلى وجرب محادثة البوت مباشرة من هنا.</div>
    </div>

    <!-- خانة الكتابة والإرسال -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك للتجربة...">
        <button id="sendBtn">إرسال</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKey');

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                alert('الرجاء إدخال مفتاح Gemini API Key في الأعلى أولاً!');
                return;
            }
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';

            const loadingId = appendMessage('جاري التفكير...', 'ai-message');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });

                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'عذراً، حدث خطأ في الرد.';

                document.getElementById(loadingId).remove();
                appendMessage(reply, 'ai-message');
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('فشل الاتصال بالخادم.', 'ai-message');
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            const id = 'msg-' + Date.now();
            div.id = id;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
